version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: biblioteca_nginx
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - biblioteca_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: biblioteca_php
    volumes:
      - ./api:/var/www/html
    depends_on:
      - postgres
    networks:
      - biblioteca_network
    environment:
      DATABASE_URL: postgresql://biblioteca:biblioteca@postgres:5432/biblioteca?serverVersion=16&charset=utf8

  postgres:
    image: postgres:16-alpine
    container_name: biblioteca_postgres
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - biblioteca_network

  frontend:
    image: node:20-alpine
    container_name: biblioteca_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - biblioteca_network

networks:
  biblioteca_network:
    driver: bridge

volumes:
  postgres_data:
